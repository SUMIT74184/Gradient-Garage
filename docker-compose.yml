services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gg
      POSTGRES_PASSWORD: gg
      POSTGRES_DB: gg
    ports:
      # 5432 is often taken by a system Postgres
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gg -d gg"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
